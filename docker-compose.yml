version: "3.9"

services:
  agency-os:
    build: .
    image: quantumreach/agency-os:latest
    container_name: qr-agency-os
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/app/data/db/agency.sqlite').execute('select 1')"]
      interval: 60s
      timeout: 10s
      retries: 3
